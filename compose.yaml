services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: business
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U app -d business']
      interval: 5s
      timeout: 3s
      retries: 20
  queue:
    image: softwaremill/elasticmq-native:1.6.12
    volumes: ['./infra/elasticmq.conf:/opt/elasticmq.conf:ro']
    ports: ['127.0.0.1:9324:9324']
  api:
    build: .
    environment: &appenv
      DATABASE_URL: postgresql+psycopg://app:localdev@db:5432/business
      SQS_ENDPOINT: http://queue:9324
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    environment: *appenv
    command: [python, -m, src.worker]
    restart: on-failure
    depends_on:
      db: {condition: service_healthy}
      queue: {condition: service_started}
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes: ['./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:11.4.0
    ports: ['127.0.0.1:3001:3000']
    volumes: ['./infra/grafana:/etc/grafana/provisioning:ro']
volumes:
  dbdata:
